<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>青禾智灌</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>

<div class="topbar">
    <span class="topbar-logo">青禾智灌</span>
    <span class="topbar-title">智能灌溉管理平台</span>
</div>

<div class="login-wrap">
    <div class="login-card" id="loginPanel">
        <div class="sys-title">用户登录</div>
        <div class="sys-sub">欢迎回来，请登录你的智慧管理账户</div>

        <div class="input-row">
            <label>账号</label>
            <input type="text" id="loginUsername" placeholder="请输入用户名">
        </div>
        <div class="input-row">
            <label>密码</label>
            <input type="password" id="loginPassword" placeholder="请输入密码" onkeydown="if(event.key==='Enter') handleLogin();">
        </div>

        <button class="login-btn" id="loginBtn" onclick="handleLogin()">登 录</button>

        <div class="login-extra">
            <a href="javascript:void(0)" onclick="switchPanel('register')">注册新账号</a>
        </div>
    </div>

    <div class="login-card" id="registerPanel" style="display: none;">
        <div class="sys-title">账号注册</div>
        <div class="sys-sub">创建你的智慧灌溉管理账户</div>

        <div class="input-row">
            <label>账号</label>
            <input type="text" id="regUsername" placeholder="设置用户名">
        </div>
        <div class="input-row">
            <label>设置密码</label>
            <input type="password" id="regPassword" placeholder="设置密码">
        </div>
        <div class="input-row">
            <label>确认密码</label>
            <input type="password" id="regConfirmPassword" placeholder="再次输入密码">
        </div>

        <button class="login-btn" id="registerBtn" onclick="handleRegister()">注 册</button>

        <div class="login-extra">
            <a href="javascript:void(0)" onclick="switchPanel('login')">返回登录</a>
        </div>
    </div>
</div>

<div class="footer">
    青禾智灌 &copy; 2026
</div>

<script src="{{ url_for('static', filename='js/login.js') }}" defer></script>
</body>
</html>
